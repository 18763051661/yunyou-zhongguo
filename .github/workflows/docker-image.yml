name: Build and Publish Docker Image

on:
  push:
    branches: [master]
  workflow_dispatch:

env:
  IMAGE: ghcr.io/18763051661/yunyou-zhongguo

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'
          cache: maven

      - name: Build WAR
        run: mvn -B clean package -DskipTests

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and push image
        uses: docker/build-push-action@v6
        with:
          context: .
          push: true
          tags: |
            ${{ env.IMAGE }}:latest
            ${{ env.IMAGE }}:${{ github.run_number }}

  smoke:
    needs: build
    runs-on: ubuntu-latest
    services:
      mysql:
        image: mysql:8.0
        env:
          MYSQL_ROOT_PASSWORD: root123
          MYSQL_DATABASE: scenic_db
        ports:
          - 3306:3306
        options: >-
          --health-cmd="mysqladmin ping -h 127.0.0.1 -uroot -proot123"
          --health-interval=10s --health-timeout=5s --health-retries=12
    steps:
      - name: Log in to GHCR
        run: echo "${{ secrets.GITHUB_TOKEN }}" | docker login ghcr.io -u ${{ github.actor }} --password-stdin

      - name: Run app container against MySQL
        run: |
          docker run -d --name app -p 8080:8080 \
            --add-host host.docker.internal:host-gateway \
            -e DB_HOST=host.docker.internal -e DB_PORT=3306 \
            -e DB_NAME=scenic_db -e DB_USER=root -e DB_PASSWORD=root123 \
            ${{ env.IMAGE }}:latest

      - name: Wait for startup
        run: |
          for i in $(seq 1 40); do
            code=$(curl -s -o /dev/null -w "%{http_code}" http://localhost:8080/ || true)
            echo "attempt $i -> HTTP $code"
            if [ "$code" = "200" ]; then break; fi
            sleep 5
          done

      - name: Check endpoints
        run: |
          echo "=== / ===";              curl -s -o /dev/null -w "%{http_code}\n" http://localhost:8080/
          echo "=== /static/index.html ==="; curl -s -o /dev/null -w "%{http_code}\n" http://localhost:8080/static/index.html
          echo "=== /api/spots ===";     curl -s -o /dev/null -w "%{http_code}\n" "http://localhost:8080/api/spots?page=1&size=3"
          echo "=== /page/home ===";     curl -s -o /dev/null -w "%{http_code}\n" http://localhost:8080/page/home

      - name: Verify PORT override (3000)
        run: |
          docker run -d --name app3000 -p 3000:3000 \
            --add-host host.docker.internal:host-gateway \
            -e PORT=3000 \
            -e DB_HOST=host.docker.internal -e DB_PORT=3306 \
            -e DB_NAME=scenic_db -e DB_USER=root -e DB_PASSWORD=root123 \
            ${{ env.IMAGE }}:${{ github.run_number }}
          for i in $(seq 1 30); do
            code=$(curl -s -o /dev/null -w "%{http_code}" http://localhost:3000/ || true)
            echo "port3000 attempt $i -> HTTP $code"
            if [ "$code" = "200" ]; then break; fi
            sleep 5
          done
          test "$(curl -s -o /dev/null -w "%{http_code}" http://localhost:3000/)" = "200"

      - name: Dump container logs
        if: always()
        run: docker logs app 2>&1 | tail -150
